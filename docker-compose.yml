# NasDeck 生产部署：一个应用容器（React + FastAPI + Nginx）+ 一个 PostgreSQL 容器。
# 使用前复制 .env.example 为 .env，并填写 POSTGRES_PASSWORD、SECRET_KEY。
name: nas-deck

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nasdeck}"
      POSTGRES_USER: "${POSTGRES_USER:-nasdeck}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请先在 .env 中填写 POSTGRES_PASSWORD}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    image: "${APP_IMAGE:-nas-deck:local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:80"
    # 所有应用配置都来自项目根目录的 .env，Compose 只负责注入和拼接
    env_file:
      - .env
    environment:
      # 容器内固定值，与数据卷挂载点对应
      DATA_ROOT: /data
      # 由数据库变量拼接，避免在 .env 中重复维护连接串
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-nasdeck}:${POSTGRES_PASSWORD:?请先在 .env 中填写 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nasdeck}"
    volumes:
      # 应用数据：Compose 工作区、图标等
      - "${DATA_DIR:-./data}:/data"
      # Docker 管理能力；不需要容器/Compose 管理时可删除此行
      - /var/run/docker.sock:/var/run/docker.sock
      # 系统设置中的宿主机存储目录需要在容器内可见时，按相同路径额外挂载，例如：
      # - /mnt/disk1:/mnt/disk1
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
