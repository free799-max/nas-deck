# 构建并推送 NasDeck 镜像到 Harbor。
#
# 目标 Runner 使用 shell executor（在宿主机上直接执行），所以这里不声明
# image / services，也不设置 DOCKER_HOST：直接使用宿主机安装的 Docker 与 buildx。
# 如果改用 docker executor，需要恢复 docker:dind 服务并设置 DOCKER_HOST。
#
# 需要预先在 GitLab 项目 Settings → CI/CD → Variables 中配置：
#   HARBOR_USER       Harbor 用户名或机器人账号
#   HARBOR_PASSWORD   Harbor 密码或机器人 token（勾选 Masked）
#
# 流水线分两阶段：
#   base  把系统依赖、Docker CLI、Python 依赖打成基础镜像推送到 Harbor，
#         标签由 Dockerfile 与 requirements 的内容哈希决定，已存在则直接跳过。
#   image 复用 base 镜像，只构建后端代码与前端产物，通过 buildx 的 registry 缓存加速。

stages:
  - base
  - image

variables:
  HARBOR_REGISTRY: harbor.cacty.top
  HARBOR_PROJECT: library
  APP_IMAGE_NAME: nas-deck
  BASE_IMAGE_NAME: nas-deck-base
  # 构建期写入镜像默认值；运行时 .env 中的同名变量会覆盖它
  MANAGE_BASE_URL: https://deck-m.freeapps.uk
  DEBIAN_MIRROR: https://mirrors.aliyun.com
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  # NAS 为 ARM 时改为 linux/arm64（base 标签含平台，不会互相覆盖）
  PLATFORMS: linux/amd64

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

.docker:
  before_script:
    - docker version
    - docker buildx version
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USER" --password-stdin "$HARBOR_REGISTRY"

base-image:
  extends: .docker
  stage: base
  script:
    - |
      BASE_TAG=$( { cat Dockerfile backend/requirements.txt; echo "$DEBIAN_MIRROR"; echo "$PIP_INDEX_URL"; echo "$PLATFORMS"; } | sha256sum | cut -c1-16 )
      BASE_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$BASE_IMAGE_NAME:$BASE_TAG"
      echo "BASE_REF=$BASE_REF" > base.env
      if docker manifest inspect "$BASE_REF" >/dev/null 2>&1; then
        echo "基础镜像已存在，跳过构建：$BASE_REF"
        exit 0
      fi
      docker buildx create --use --name nasdeck --driver docker-container >/dev/null 2>&1 || docker buildx use nasdeck
      docker buildx build \
        --target base \
        --platform "$PLATFORMS" \
        --build-arg "DEBIAN_MIRROR=$DEBIAN_MIRROR" \
        --build-arg "PIP_INDEX_URL=$PIP_INDEX_URL" \
        --cache-from "type=registry,ref=$BASE_REF-cache" \
        --cache-to "type=registry,ref=$BASE_REF-cache,mode=max" \
        --tag "$BASE_REF" \
        --push .
  artifacts:
    reports:
      dotenv: base.env

app-image:
  extends: .docker
  stage: image
  needs:
    - job: base-image
      artifacts: true
  script:
    - |
      APP_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$APP_IMAGE_NAME"
      TAGS="--tag $APP_REF:$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --tag $APP_REF:$CI_COMMIT_TAG"
      fi
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS --tag $APP_REF:latest"
      fi
      docker buildx create --use --name nasdeck --driver docker-container >/dev/null 2>&1 || docker buildx use nasdeck
      docker buildx build \
        --platform "$PLATFORMS" \
        --build-arg "BASE_IMAGE=$BASE_REF" \
        --build-arg "MANAGE_BASE_URL=$MANAGE_BASE_URL" \
        --cache-from "type=registry,ref=$APP_REF:buildcache" \
        --cache-to "type=registry,ref=$APP_REF:buildcache,mode=max" \
        $TAGS \
        --push .
      echo "已推送：$APP_REF:$CI_COMMIT_SHORT_SHA"
