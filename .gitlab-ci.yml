# 推送 v* 版本标签时构建并推送 NasDeck 镜像到 Harbor。
#
# 触发方式：只在推送 v主.次.修订 标签时运行（由 scripts/release.sh 生成并推送），
# 分支推送、合并请求、手动运行都不会触发，避免每次提交都重新构建。
#
# 基础镜像 harbor.cacty.top/library/nas-deck-base 由 docker/base.Dockerfile 手动
# 构建并推送，流水线只拉取使用，不构建它。
#
# 目标 Runner 使用 shell executor（在宿主机上直接执行），所以这里不声明
# image / services，也不设置 DOCKER_HOST：直接使用宿主机安装的 Docker 与 buildx。
# 如果改用 docker executor，需要恢复 docker:dind 服务并设置 DOCKER_HOST。
#
# 推送 Harbor 使用 Runner 宿主机上已有的 Docker 登录状态（需提前在该机器执行
# docker login harbor.cacty.top），流水线本身不接收 Harbor 账号密码。
#
# 构建只用 Harbor 上的镜像（基础镜像与 baseimg 上游镜像），Runner 不访问 docker.io。

stages:
  - image

variables:
  HARBOR_REGISTRY: harbor.cacty.top
  HARBOR_PROJECT: library
  APP_IMAGE_NAME: nas-deck
  BASE_IMAGE: harbor.cacty.top/library/nas-deck-base:latest
  NODE_IMAGE: harbor.cacty.top/baseimg/node:22-alpine
  # 构建期写入镜像默认值；运行时 .env 中的同名变量会覆盖它
  MANAGE_BASE_URL: https://deck-m.freeapps.uk
  # NAS 为 ARM 时改为 linux/arm64
  PLATFORMS: linux/amd64

workflow:
  rules:
    # 只响应语义化版本标签；其余情况一律不创建流水线
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
    - when: never

.docker:
  before_script:
    - docker version
    - docker buildx version

app-image:
  extends: .docker
  stage: image
  script:
    - |
      APP_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$APP_IMAGE_NAME"
      TAG="$CI_COMMIT_TAG"
      TAGS="--tag $APP_REF:$TAG --tag $APP_REF:$CI_COMMIT_SHORT_SHA"
      # 正式版本额外打 minor / major / latest；预发布标签（如 v1.0.0-rc.1）只保留自身
      if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        CORE="${TAG#v}"
        MAJOR="${CORE%%.*}"
        MINOR="${CORE#*.}"
        MINOR="${MINOR%%.*}"
        TAGS="$TAGS --tag $APP_REF:v$MAJOR.$MINOR --tag $APP_REF:v$MAJOR --tag $APP_REF:latest"
      fi
      echo "本次构建标签：$TAGS"
      docker buildx create --use --name nasdeck --driver docker-container >/dev/null 2>&1 || docker buildx use nasdeck
      docker buildx build \
        --platform "$PLATFORMS" \
        --build-arg "BASE_IMAGE=$BASE_IMAGE" \
        --build-arg "NODE_IMAGE=$NODE_IMAGE" \
        --build-arg "MANAGE_BASE_URL=$MANAGE_BASE_URL" \
        --label "org.opencontainers.image.title=NasDeck" \
        --label "org.opencontainers.image.version=$TAG" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$APP_REF:buildcache" \
        --cache-to "type=registry,ref=$APP_REF:buildcache,mode=max" \
        $TAGS \
        --push .
      echo "已推送：$APP_REF:$TAG"
